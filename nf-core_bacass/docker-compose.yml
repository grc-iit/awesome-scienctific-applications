# nf-core/bacass simulated cluster — build, single-node, multi-node tests.
#
# Single-node (test profile, ~30 min including conda env solves):
#   docker compose run --rm validate
#
# Multi-node cluster (3 independent assemblies on head + 2 workers):
#   docker compose up --abort-on-container-exit --exit-code-from head head
#
# NOTE: first run solves per-process conda envs; ~5-10 min extra.

services:

  validate:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    image: sci-nf-bacass-deploy:latest
    command:
      - bash
      - -c
      - |
        /opt/run_bacass.sh /output/run && \
        echo '=== SINGLE-NODE TEST PASSED ==='
    volumes:
      - output:/output

  head:
    image: sci-nf-bacass-deploy:latest
    hostname: head
    depends_on:
      worker1:
        condition: service_healthy
      worker2:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        /usr/sbin/sshd && \
        /opt/run_bacass.sh /output/head &
        ssh -o StrictHostKeyChecking=no worker1 \
          "/opt/run_bacass.sh /output/worker1" &
        ssh -o StrictHostKeyChecking=no worker2 \
          "/opt/run_bacass.sh /output/worker2" &
        wait && \
        find /output/head    -path '*/outputs/*' -type f -print -quit | grep -q . && \
        find /output/worker1 -path '*/outputs/*' -type f -print -quit | grep -q . && \
        find /output/worker2 -path '*/outputs/*' -type f -print -quit | grep -q . && \
        echo '=== CLUSTER TEST PASSED ==='
    volumes:
      - output:/output
    networks:
      - mpi-net

  worker1:
    image: sci-nf-bacass-deploy:latest
    hostname: worker1
    command: /usr/sbin/sshd -D
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/localhost/22'"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 3s
    volumes:
      - output:/output
    networks:
      - mpi-net

  worker2:
    image: sci-nf-bacass-deploy:latest
    hostname: worker2
    command: /usr/sbin/sshd -D
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/localhost/22'"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 3s
    volumes:
      - output:/output
    networks:
      - mpi-net

networks:
  mpi-net:

volumes:
  output:
